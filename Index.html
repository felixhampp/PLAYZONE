<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>PLAYZONE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E9;--ink:#23211F;--card:#fff;--mut:#7A746B;--line:#E4DDD0;--c:#E8684A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1B19;--ink:#F2EDE4;--card:#2A2825;--mut:#A39C90;--line:#3A3733}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.4 "Fredoka",ui-rounded,system-ui,sans-serif;overflow-x:hidden;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:0 18px}
.fade{animation:fade .35s ease both}@keyframes fade{from{opacity:0;transform:translateY(10px)}}
h1{font-size:44px;letter-spacing:1px;margin:22px 0 2px;font-weight:700}h1 b{color:#E8684A}
.sub{color:var(--mut);margin:0 0 18px}
h2{font-size:18px;margin:22px 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:0;text-align:left;color:var(--ink);font:inherit;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.96)}
.tile{height:92px;background:var(--c);display:flex;align-items:center;justify-content:center}
.tile svg{width:54px;height:54px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.card .t{padding:10px 12px 12px}.card b{display:block;font-size:17px}.card small{color:var(--mut);font-size:13px}
.foot{color:var(--mut);text-align:center;font-size:13px;margin:26px 0 20px}
.top{display:flex;align-items:center;gap:12px;padding:14px 0}
.top h3{margin:0;font-size:22px;flex:1}
.ib{width:48px;height:48px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;cursor:pointer}
.body{flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:18px}
.stage{flex:1;width:100%;min-height:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center}
.btn{background:var(--c);color:#fff;border:0;border-radius:18px;padding:14px 22px;font:600 19px "Fredoka",sans-serif;min-height:56px;width:100%;cursor:pointer;transition:transform .12s;touch-action:manipulation}
.btn:active{transform:scale(.97)}.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.start{margin:auto 0;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.start .tile{width:110px;height:110px;border-radius:30px}.start p{color:var(--mut);margin:0;max-width:340px}
.seg{display:flex;gap:8px;width:100%}.seg button{flex:1;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 16px "Fredoka";cursor:pointer}
.seg button.on{background:var(--c);border-color:var(--c);color:#fff}
.status{font-size:20px;font-weight:600;text-align:center;min-height:30px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 14px;font-size:14px;color:var(--mut)}
.big{font-size:40px;font-weight:700;text-align:center}.dim{color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(20,18,16,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:9;animation:fade .25s}
.ov>div{background:var(--card);border-radius:28px;padding:26px;width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:12px}
.ov h4{font-size:30px;margin:0}.ov p{margin:0;color:var(--mut)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,360px)}
.cell{aspect-ratio:1;border-radius:20px;border:2px solid var(--line);background:var(--card);padding:14px;cursor:pointer}
.cell svg{width:100%;height:100%;fill:none;stroke-width:5;stroke-linecap:round}
.cell path,.cell circle{stroke-dasharray:1;stroke-dashoffset:0;animation:dr .35s ease}@keyframes dr{from{stroke-dashoffset:1}}
.cell.X svg{stroke:#E8684A}.cell.O svg{stroke:#2A9D8F}.cell.win{background:var(--c);border-color:var(--c)}.cell.win svg{stroke:#fff}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#3F6FA8;padding:8px;border-radius:20px;width:min(100%,380px)}
.col{display:flex;flex-direction:column;gap:4px;border:0;background:none;padding:0;cursor:pointer}
.slot{aspect-ratio:1;border-radius:50%;background:var(--bg);overflow:hidden;position:relative}
.disc{position:absolute;inset:0;border-radius:50%;animation:drop .45s cubic-bezier(.5,0,.8,.6) both}
@keyframes drop{from{transform:translateY(calc(var(--d)*-115%))}}
.disc.r{background:#D9534F}.disc.y{background:#F0B429}.disc.w{box-shadow:inset 0 0 0 5px #fff}
.rxw{flex:1;width:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.rx{flex:1;border-radius:24px;border:0;background:#3B3935;color:#fff;font:700 28px "Fredoka";display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation;transition:background .1s}
.rx small{font-size:14px;font-weight:500;opacity:.7}.rx.top{transform:rotate(180deg)}.rx.go{background:#4C9A5B}
.sw{display:flex;gap:12px;width:100%}.sw div{flex:1;height:110px;border-radius:22px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--mut);background:var(--card);transition:background .2s}
.sl{width:100%;display:flex;align-items:center;gap:10px;font-weight:700}.sl input{flex:1;height:38px;accent-color:var(--c)}
canvas{width:min(100%,380px);aspect-ratio:1;background:var(--card);border:2px solid var(--line);border-radius:28px;touch-action:none}
.pulse{animation:pl 1s infinite}@keyframes pl{50%{opacity:.35}}
.bigsw{width:100%;height:200px;border-radius:28px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--card)}
.cnt{font-size:56px;color:#fff;background:rgba(0,0,0,.35);width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;animation:pop .4s}
.cnt.s{font-size:15px;width:auto;height:auto;padding:4px 12px;border-radius:99px}
.sw .a,.sw .b{height:150px;animation:pop .5s both}.sw .b{animation-delay:.25s}@keyframes pop{from{opacity:0;transform:scale(.6)}}
canvas.pong{width:min(100%,calc((100dvh - 230px)*.6));aspect-ratio:3/5;border-radius:22px;border:0;background:#27495C}
button{touch-action:manipulation}body{overscroll-behavior:none}
#app{height:100dvh}
.grid3{width:min(100%,360px,calc(100dvh - 270px))}.c4{width:min(100%,380px,calc((100dvh - 270px)*1.15))}
.card{animation:fade .4s both}.grid .card:nth-child(2){animation-delay:.05s}.grid .card:nth-child(3){animation-delay:.1s}.grid .card:nth-child(4){animation-delay:.15s}
.ov>div{animation:pop .35s both}
.chips{display:flex;gap:8px;width:100%}.chip{flex:1;border:2px solid var(--line);border-radius:14px;padding:6px 10px;font-size:14px;background:var(--card);text-align:center;transition:.2s}.chip.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c);font-weight:600}
canvas.bill{width:min(100%,calc((100dvh - 250px)*.577));aspect-ratio:300/520;border:0;border-radius:20px;background:#7A4A2B}
#app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.body{padding-bottom:calc(34px + env(safe-area-inset-bottom,0px))}
.grid3{width:min(86%,300px,calc(100svh - 340px));gap:8px}.cell{padding:10px;border-radius:16px}
.c4{width:min(100%,380px,calc((100svh - 300px)*1.1))}
.mboard{width:min(100%,calc(100svh - 340px));aspect-ratio:1}.mboard svg{width:100%;height:100%;display:block}
.pc{transform-box:fill-box;transform-origin:center}.pop{animation:pop .3s}.sl{animation:sl .28s ease-out}@keyframes sl{from{transform:translate(var(--dx),var(--dy))}}
.rmv{animation:rmv .3s forwards}@keyframes rmv{to{transform:scale(0);opacity:0}}.hl{animation:pl 1s infinite}
canvas.air{width:min(100%,520px,calc((100svh - 260px)*.6));aspect-ratio:3/5;border:0;border-radius:24px;background:#26323F;touch-action:none}
.mgbar{display:flex;justify-content:space-between;align-items:center;width:100%}
canvas.golf{width:min(100%,520px,calc((100svh - 310px)*.577));aspect-ratio:300/520;border:0;border-radius:22px;background:#5BA55B;touch-action:none}
.rpsa{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;flex:1;min-height:0}.rpsa b{color:var(--mut)}
.rb{flex:1;max-width:140px;aspect-ratio:1;border:2px solid var(--line);border-radius:24px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:54px;line-height:1.1;animation:pop .4s}
.rb small{font-size:14px;color:var(--mut)}.rb.w{border-color:var(--c);box-shadow:0 0 0 3px var(--c)}.rb.l{opacity:.5}
.rpsr{display:flex;gap:10px;width:100%;min-height:96px}.rpsb{flex:1;border:2px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);padding:12px 4px;font:600 15px "Fredoka",sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform .12s}.rpsb span{font-size:46px;line-height:1}.rpsb:active{transform:scale(.94)}
.dab{width:min(100%,calc(100svh - 340px));aspect-ratio:1}.dab svg{width:100%;height:100%;display:block;background:var(--card);border:2px solid var(--line);border-radius:22px}
.dab .ln{stroke-dasharray:1;animation:dr .25s}.dab .bx{transform-box:fill-box;transform-origin:center;animation:pop .3s}
.rpsrow{display:flex;gap:10px;width:100%}.rpsb{flex:1;aspect-ratio:1;max-height:110px;font-size:50px;border-radius:22px;border:2px solid var(--line);background:var(--card);cursor:pointer;transition:transform .12s}.rpsb:active{transform:scale(.93)}
.rc{flex:1;height:130px;border-radius:24px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:56px;line-height:1.1}.rc small{font-size:14px;color:var(--mut)}
.rc.win{border-color:var(--c);box-shadow:0 0 0 3px var(--c)}.rc.flip span{animation:flip .4s}@keyframes flip{from{transform:rotateY(90deg);opacity:0}}
</style></head><body><div id="app"></div>
<script>
/* ---------- Kern ---------- */
const $app=document.getElementById('app');
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k==='html')e.innerHTML=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x));return e};
const store={get(k,d){try{const v=localStorage.getItem('pz:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('pz:'+k,JSON.stringify(v))}catch(e){}}};
const f2=x=>x.toFixed(2).replace('.',',');
const CATS={duel:'⚔️ Zwei-Spieler-Duelle',chal:'🎯 Challenges',party:'🎉 Partyspiele',quiz:'🧠 Quiz & Wissen'};
const GAMES=[]; /* Registry: neue Spiele einfach mit GAMES.push({...}) anhängen */
const turn=(s,n,R)=>{if(n===1)s.r++;else if(s.p===0)s.p=1;else{s.p=0;s.r++}return s.r>=R};

/* ---------- Startseite ---------- */
function home(){
  $app.replaceChildren();const v=h('div',{class:'fade'});
  v.append(h('h1',{html:'PLAY<b>ZONE</b>'}),h('p',{class:'sub'},'Spiele zu zweit, mit Freunden oder solo.'));
  for(const k in CATS){const gs=GAMES.filter(g=>g.cat===k);if(!gs.length)continue;
    v.append(h('h2',{},CATS[k]));const gr=h('div',{class:'grid'});
    gs.forEach(g=>gr.append(h('button',{class:'card',style:`--c:${g.color}`,onclick:()=>open(g)},
      h('div',{class:'tile',html:`<svg viewBox="0 0 48 48">${g.icon}</svg>`}),
      h('div',{class:'t'},h('b',{},g.name),h('small',{},g.tag)))));v.append(gr)}
  v.append(h('div',{class:'foot'},'Version 1 · weitere Spiele folgen'));
  $app.style.overflowY='auto';$app.append(v);
}

/* ---------- Spielrahmen ---------- */
function open(g){
  $app.replaceChildren();$app.style.overflowY='hidden';
  let timers=[],kill=null,players=1,bot=null;const LV=['🟢 Leicht','🟡 Mittel','🔴 Schwer'];
  const lvSeg=()=>{const q=h('div',{class:'seg'});LV.forEach((t,i)=>q.append(h('button',{class:i===bot?'on':'',onclick:()=>{bot=i;[...q.children].forEach((x,j)=>x.classList.toggle('on',j===i))}},t)));return q};
  const stop=()=>{timers.forEach(clearTimeout);timers=[];if(kill){try{kill()}catch(e){}kill=null}document.querySelectorAll('.ov').forEach(o=>o.remove())};
  const body=h('div',{class:'body fade'});
  const view=h('div',{style:`--c:${g.color};display:flex;flex-direction:column;height:100%`},
    h('div',{class:'top'},h('button',{class:'ib',onclick:()=>{stop();home()},'aria-label':'Zurück'},'←'),h('h3',{},g.name),
      h('button',{class:'ib',onclick:run,'aria-label':'Neustart'},'↻')),body);
  $app.append(view);
  const api={get players(){return players},get bot(){return bot},
    t(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id},
    rec(key,val,low,fmt){const k=g.id+':'+key,old=store.get(k,null);const nw=old==null||(low?val<old:val>old);if(nw)store.set(k,val);return nw?'🏆 Neuer Rekord: '+fmt(val):'Rekord: '+fmt(old)},
    end(r){const ov=h('div',{class:'ov'},h('div',{style:`--c:${g.color}`},h('h4',{},r.title),r.text?h('p',{},r.text):'',r.rec?h('p',{},r.rec):'',bot!=null?h('p',{},'Schwierigkeit für die nächste Runde:'):'',bot!=null?lvSeg():'',
      h('button',{class:'btn',onclick:()=>{ov.remove();run()}},r.btn||'Nochmal'),h('button',{class:'btn ghost',onclick:()=>{stop();home()}},'Zum Menü')));document.body.append(ov)}};
  function run(){stop();body.replaceChildren();const st=h('div',{class:'stage'});if(bot!=null)body.append(h('div',{class:'pill',style:'align-self:center;margin-bottom:8px'},'🤖 Bot · '+LV[bot].slice(3)));body.append(st);kill=g.init(st,api)||null}
  const s=h('div',{class:'start'},h('div',{class:'tile',html:`<svg viewBox="0 0 48 48" style="width:60px;height:60px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round">${g.icon}</svg>`}),
    h('h2',{style:'margin:0'},g.name),h('p',{},g.rules));
  if(g.modes){const seg=h('div',{class:'seg'});[1,2].forEach(n=>{const b=h('button',{class:n===1?'on':'',onclick:()=>{players=n;[...seg.children].forEach((x,i)=>x.classList.toggle('on',i+1===n))}},n===1?'Solo':'Duell');seg.append(b)});s.append(seg)}
  if(g.bot){const ds=lvSeg();ds.style.display='none';const ms=h('div',{class:'seg'});
    ['👥 Gegen Freund','🤖 Gegen Bot'].forEach((t,i)=>ms.append(h('button',{class:i?'':'on',onclick:()=>{bot=i?(bot??1):null;[...ms.children].forEach((x,j)=>x.classList.toggle('on',j===i));ds.style.display=i?'flex':'none';[...ds.children].forEach((x,j)=>x.classList.toggle('on',j===bot))}},t)));s.append(ms,ds)}
  s.append(h('button',{class:'btn',onclick:run},'Start'));body.append(s);
}

/* ---------- Spiel 1: Tic-Tac-Toe ---------- */
const SX='<svg viewBox="0 0 40 40"><path pathLength="1" d="M9 9L31 31M31 9L9 31"/></svg>',SO='<svg viewBox="0 0 40 40"><circle pathLength="1" cx="20" cy="20" r="12"/></svg>';
GAMES.push({id:'ttt',bot:1,cat:'duel',name:'Tic-Tac-Toe',tag:'2 Spieler',color:'#E8684A',
 icon:'<path d="M17 7v34M31 7v34M7 17h34M7 31h34"/>',
 rules:'Setze abwechselnd X und O. Wer zuerst drei in einer Reihe hat, gewinnt.',
 init(el,api){let b=Array(9).fill(''),t='X',over=0;const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const st=h('div',{class:'status'}),gr=h('div',{class:'grid3'});
  const cells=b.map((_,i)=>{const c=h('button',{class:'cell',onclick:()=>mv(i)});gr.append(c);return c});
  const upd=()=>st.textContent=api.bot!=null&&t==='O'?'🤖 Bot denkt nach …':t+' ist dran';
  const emp=()=>b.map((v,i)=>v?-1:i).filter(i=>i>=0),pick=a=>a[Math.floor(Math.random()*a.length)];
  const wn=pl=>emp().find(i=>{b[i]=pl;const w=L.some(l=>l.every(k=>b[k]===pl));b[i]='';return w});
  const mm=(bd,pl,d)=>{const w=L.find(l=>bd[l[0]]&&bd[l[0]]===bd[l[1]]&&bd[l[1]]===bd[l[2]]);if(w)return bd[w[0]]==='O'?10-d:d-10;if(bd.every(Boolean))return 0;let r=pl==='O'?-99:99;
   bd.forEach((v,i)=>{if(v)return;bd[i]=pl;const x=mm(bd,pl==='O'?'X':'O',d+1);bd[i]='';r=pl==='O'?Math.max(r,x):Math.min(r,x)});return r};
  function botMove(){const e=emp(),lv=api.bot;if(lv===0)return pick(e);
   if(lv===1){const a=wn('O');if(a!==undefined)return a;const c=wn('X');return c!==undefined?c:pick(e)}
   const sc=e.map(i=>{b[i]='O';const x=mm(b,'X',1);b[i]='';return x}),m=Math.max(...sc);return pick(e.filter((_,k)=>sc[k]===m))}
  function mv(i,bm){if(over||b[i]||(api.bot!=null&&t==='O'&&!bm))return;b[i]=t;cells[i].innerHTML=t==='X'?SX:SO;cells[i].classList.add(t);
   const w=L.find(l=>l.every(k=>b[k]===t));
   if(w){over=1;w.forEach(k=>cells[k].classList.add('win'));st.textContent=t+' gewinnt!';api.t(()=>api.end({title:api.bot!=null?(t==='X'?'Du gewinnst! 🎉':'Der Bot gewinnt 🤖'):t+' gewinnt! 🎉'}),1000)}
   else if(b.every(Boolean)){over=1;api.t(()=>api.end({title:'Unentschieden'}),600)}
   else{t=t==='X'?'O':'X';upd();if(api.bot!=null&&t==='O')api.t(()=>mv(botMove(),1),500)}}
  el.append(st,gr);upd()}});

/* ---------- Spiel 2: Vier gewinnt ---------- */
GAMES.push({id:'c4',bot:1,cat:'duel',name:'Vier gewinnt',tag:'2 Spieler',color:'#3F6FA8',
 icon:'<circle cx="15" cy="15" r="7"/><circle cx="33" cy="15" r="7" fill="#fff"/><circle cx="15" cy="33" r="7" fill="#fff"/><circle cx="33" cy="33" r="7"/>',
 rules:'Tippe auf eine Spalte, der Stein fällt hinein. Wer zuerst vier in einer Reihe hat, gewinnt.',
 init(el,api){const R=6,C=7,b=Array.from({length:R},()=>Array(C).fill(0));let p=1,over=0;
  const names=['','Rot','Gelb'],cl=['','r','y'];
  const st=h('div',{class:'status'}),bd=h('div',{class:'c4'}),cols=[];
  for(let c=0;c<C;c++){const col=h('button',{class:'col',onclick:()=>drop(c),'aria-label':'Spalte '+(c+1)});for(let r=0;r<R;r++)col.append(h('div',{class:'slot'}));bd.append(col);cols.push(col)}
  const upd=()=>st.textContent=api.bot!=null&&p===2?'🤖 Bot denkt nach …':names[p]+' ist dran';
  const ORD=[3,2,4,1,5,0,6],rowOf=(bd,c)=>{let r=R-1;while(r>=0&&bd[r][c])r--;return r};
  const wins=(bd,r,c,pl)=>[[0,1],[1,0],[1,1],[1,-1]].some(([dr,dc])=>{let n=1;for(const q of[1,-1])for(let k=1;k<4;k++){const y=r+dr*k*q,x=c+dc*k*q;if(y<0||y>=R||x<0||x>=C||bd[y][x]!==pl)break;n++}return n>=4});
  const ev=bd=>{let sc=0;const Wd=cs=>{let a=0,o=0;cs.forEach(([y,x])=>{const v=bd[y][x];if(v===2)a++;else if(v===1)o++});if(a&&o)return;sc+=a===4?1000:a===3?5:a===2?2:0;sc-=o===4?1000:o===3?6:o===2?2:0};
   for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const y=r+3*dr,x=c+3*dc;if(y<0||y>=R||x<0||x>=C)continue;Wd([0,1,2,3].map(k=>[r+dr*k,c+dc*k]))}
   for(let r=0;r<R;r++)sc+=bd[r][3]===2?3:bd[r][3]===1?-3:0;return sc};
  function ab(bd,d,al,be,mx){const vm=ORD.filter(c=>!bd[0][c]);if(!vm.length)return 0;if(d===0)return ev(bd);let v=mx?-1e9:1e9;const pl=mx?2:1;

  function ready(){const c=c0();ball.x=c.tee[0];ball.y=c.tee[1];ball.vx=ball.vy=0;st='aim';pend=null;upd();msg.textContent=nm[pl]+(isBot()?'':' ist dran – zurückziehen und loslassen');if(isBot()){msg.textContent='🤖 Bot überlegt …';fireAt=gt+1.1;pend=plan(api.bot,c,ball.x,ball.y,fireAt)}}

  function sunk(pick){st='sunk';sunkT=.7;ball.vx=ball.vy=0;if(!pick){ball.x=c0().hole[0];ball.y=c0().hole[1]}msg.textContent=pick?'Maximal 8 Schläge – Ball aufgehoben':'⛳ Eingelocht in '+str[pl]+'!'}
  function next(){if(pl===0){pl=1;ready()}else summary()}

   const ov=h('div',{class:'ov'},h('div',{style:'--c:#7FA83A'},h('h4',{},po?'Stechen':`Bahn ${hi+1} geschafft`),
    h('p',{},`${nm[0]}: ${str[0]} Schläge  ·  ${nm[1]}: ${str[1]}`),h('p',{style:'font-weight:600;color:var(--ink)'},`Gesamt: ${nm[0]} ${tot[0]} : ${tot[1]} ${nm[1]}`),tie?h('p',{},'Gleichstand – Stechen auf einer zufälligen Bahn!'):(po&&!dec?h('p',{},'Wieder gleich – nächstes Stechen!'):''),
    h('button',{class:'btn',onclick:()=>{ov.remove();
     if(fin){const w=po?(str[0]<str[1]?0:1):(tot[0]<tot[1]?0:1);api.end({title:bot?(w===0?'Du gewinnst! 🎉':'Der Bot gewinnt 🤖'):nm[w]+' gewinnt! 🎉',text:`${nm[0]} ${tot[0]} : ${tot[1]} ${nm[1]} Schläge`+(po?' – im Stechen entschieden':'')});return}
     if(tie||po)(po=1,hi=Math.floor(Math.random()*7));else hi++;pl=0;str=[0,0];ready()}},fin?'Endergebnis':tie||po?'Stechen starten':'Nächste Bahn')));document.body.append(ov)}
  function sub(){gt+=DT;const s=stepBall(c0(),ball,gt,DT);
   if(st==='aim'||st==='roll'){const mv=ball.vx||ball.vy;if(s)sunk();else if(st==='roll'&&!mv){if(str[pl]>=MAXS)sunk(1);else{st='aim';if(isBot())replan();else msg.textContent=nm[pl]+' ist dran'}}else if(st==='aim'&&mv)st='roll'}}
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]};

  cv.onpointermove=e=>{if(S)Cp=pt(e)};
  cv.onpointerup=()=>{if(!S)return;const dx=S[0]-Cp[0],dy=S[1]-Cp[1],pw=Math.min(1,Math.hypot(dx,dy)/110);S=null;if(pw>.06&&st==='aim')shoot(Math.atan2(dy,dx),V(pw))};cv.onpointercancel=()=>{S=null};
  const rr=(x,y,w,h2,r)=>{ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h2,r):ctx.rect(x,y,w,h2)};

   ctx.setTransform(cv.width/W,0,0,cv.width/W,0,0);ctx.fillStyle='#5BA55B';rr(0,0,W,H,22);ctx.fill();
   for(let i=0;i<9;i++){ctx.fillStyle=i%2?'rgba(255,255,255,.06)':'rgba(0,0,0,.04)';ctx.fillRect(14,14+i*56,W-28,56)}
   ctx.strokeStyle='#7B5A3A';ctx.lineWidth=14;ctx.lineJoin='round';rr(7,7,W-14,H-14,18);ctx.stroke();
   ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(c.tee[0],c.tee[1],BR+4,0,7);ctx.fill();

   ctx.strokeStyle='#7B5A3A';ctx.lineWidth=8;ctx.lineCap='round';c.segs.forEach(s=>{ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3]);ctx.stroke()});
   ctx.fillStyle='#C9533F';c.mv.forEach(m=>{const r=mvRect(m,gt);rr(r[0],r[1],r[2],r[3],5);ctx.fill()});
   ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(c.hole[0]+HR+2,c.hole[1]);ctx.lineTo(c.hole[0]+HR+2,c.hole[1]-28);ctx.stroke();ctx.fillStyle='#E8684A';ctx.beginPath();ctx.moveTo(c.hole[0]+HR+2,c.hole[1]-28);ctx.lineTo(c.hole[0]+HR+16,c.hole[1]-22);ctx.lineTo(c.hole[0]+HR+2,c.hole[1]-16);ctx.fill();
   const k=st==='sunk'?Math.max(0,sunkT/.7):1;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(ball.x+1.5,ball.y+2.5,BR*k,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,BR*k,0,7);ctx.fill();
   if(S&&Cp&&st==='aim'&&!isBot()){const dx=S[0]-Cp[0],dy=S[1]-Cp[1],l=Math.hypot(dx,dy);if(l>6){const p=Math.min(1,l/110),a=Math.atan2(dy,dx),L=24+p*110;
    ctx.setLineDash([6,6]);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+Math.cos(a)*L,ball.y+Math.sin(a)*L);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(0,0,0,.35)';rr(24,24,80,9,4);ctx.fill();ctx.fillStyle=p>.75?'#E8684A':p>.4?'#F0B429':'#fff';rr(24,24,80*p,9,4);ctx.fill()}}
   if(paused){ctx.fillStyle='rgba(20,30,40,.5)';rr(0,0,W,H,22);ctx.fill();ctx.fillStyle='#fff';ctx.font='700 30px Fredoka,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Pause',W/2,H/2)}}
  const loop=t=>{raf=requestAnimationFrame(loop);const dt=Math.min(.05,(t-(last||t))/1000);last=t;
   if(!paused){if(st==='sunk'){sunkT-=dt;if(sunkT<=0)next()}
    acc+=dt;let n=0;while(acc>=DT&&n++<40){acc-=DT;sub();if(st==='aim'&&isBot()&&pend&&gt>=fireAt&&!ball.vx&&!ball.vy){shoot(pend.a,pend.v)}}if(n>=40)acc=0}draw()};
  ready();raf=requestAnimationFrame(loop);return()=>cancelAnimationFrame(raf)}});
})();

/* ---------- Spiel 12: Schere, Stein, Papier ---------- */
(()=>{
/*RPS*/
const bt=(a,b)=>(a-b+3)%3===1; /* 0 Stein, 1 Papier, 2 Schere */
function pickRPS(lv,hist,bh){const R=Math.floor(Math.random()*3);if(lv===0||!hist.length)return R;
 const cnt=[0,0,0];hist.forEach(x=>cnt[x]++);const fc=(cnt.indexOf(Math.max(...cnt))+1)%3;if(lv===1)return Math.random()<.45?fc:R;
 if(Math.random()<.1)return R;const n=hist.length;
 const models=[i=>i>=2?hist[i-2]+','+hist[i-1]:null,i=>i>=1?hist[i-1]+'/'+bh[i-1]:null,i=>i>=1?''+hist[i-1]:null];
 for(const K of models){const key=K(n);if(key==null)continue;const c=[0,0,0];for(let i=0;i<n;i++)if(K(i)===key)c[hist[i]]++;const t=c[0]+c[1]+c[2],m=Math.max(...c);
  if(t>=2&&m/t>=.5)return(c.indexOf(m)+1)%3}
 return fc}
/*ENDRPS*/
GAMES.push({id:'rps',bot:1,cat:'duel',name:'Schere Stein Papier',tag:'2 Spieler',color:'#7A5CC9',
 icon:'<circle cx="15" cy="31" r="8"/><rect x="27" y="22" width="13" height="16" rx="3"/><path d="M18 6l7 11M32 6l-7 11"/>',
 rules:'Best of 7: Wer zuerst 4 Runden gewinnt, siegt. Stein schlägt Schere, Schere schlägt Papier, Papier schlägt Stein. Unentschieden zählen nicht. Zu zweit wählt erst Spieler 1 (versteckt), dann Spieler 2 – danach wird aufgedeckt.',
 init(el,api){const bot=api.bot!=null,nm=bot?['Du','🤖 Bot']:['Spieler 1','Spieler 2'],EM=['✊','✋','✌️'],NM=['Stein','Papier','Schere'];
  let sc=[0,0],ph=0,pk=[null,null],hist=[],bh=[],bp=0;
  const chips=[0,1].map(()=>h('div',{class:'chip'})),cards=[0,1].map(()=>h('div',{class:'rc'})),pr=h('div',{class:'status'}),nb=h('button',{class:'btn',style:'display:none'}),
   row=h('div',{class:'rpsrow'},...[0,1,2].map(m=>h('button',{class:'rpsb','aria-label':NM[m],onclick:()=>choose(m)},EM[m])));
  el.append(h('div',{class:'chips'},...chips),h('div',{class:'rpsrow'},...cards),pr,row,nb);
  function view(){chips.forEach((c,i)=>{c.className='chip'+((ph===0&&i===0)||(ph===2&&i===1)?' on':'');c.textContent=`${nm[i]} · ${sc[i]}`});
   cards.forEach((c,i)=>{c.className='rc';c.innerHTML=`<span>${ph===3?EM[pk[i]]:'❔'}</span><small>${nm[i]}</small>`});row.style.display=ph===0||ph===2?'flex':'none'}
  function newRound(){ph=0;pk=[null,null];nb.style.display='none';if(bot)bp=pickRPS(api.bot,hist,bh); /* Bot entscheidet VOR der Wahl des Spielers */
   pr.textContent=bot?'Wähle!':'Spieler 1: Wähle!';view()}
  function choose(m){if(ph===0){pk[0]=m;if(bot){pk[1]=bp;reveal()}else{ph=1;pr.textContent='Gib das Handy an Spieler 2 – ohne hinzusehen!';nb.style.display='';nb.textContent='Spieler 2 ist bereit';nb.onclick=()=>{ph=2;nb.style.display='none';pr.textContent='Spieler 2: Wähle!';view()};view()}}
   else if(ph===2){pk[1]=m;reveal()}}
  function reveal(){ph=3;const w=pk[0]===pk[1]?0:bt(pk[0],pk[1])?1:2;if(w)sc[w-1]++;hist.push(pk[0]);bh.push(pk[1]);view();cards.forEach(c=>c.classList.add('flip'));if(w)cards[w-1].classList.add('win');
   pr.textContent=w?`${nm[w-1]} gewinnt die Runde`:'Unentschieden – zählt nicht';
   if(sc[0]>=4||sc[1]>=4){const m=sc[0]>=4?0:1;api.t(()=>api.end({title:bot?(m===0?'Du gewinnst! 🎉':'Der Bot gewinnt 🤖'):nm[m]+' gewinnt! 🎉',text:`Endstand ${sc[0]} : ${sc[1]}`,btn:'Revanche'}),1400)}
   else if(bot)api.t(newRound,1700);else{nb.style.display='';nb.textContent='Nächste Runde';nb.onclick=newRound}}
  newRound()}});
})();

/* ---------- Spiel 13: Käsekästchen ---------- */
(()=>{
/*KK*/
const EB=Array.from({length:40},()=>[]),BE=[];
for(let r=0;r<4;r++)for(let c=0;c<4;c++){const es=[r*4+c,(r+1)*4+c,20+r*5+c,20+r*5+c+1];BE.push(es);es.forEach(e=>EB[e].push(r*4+c))}
const closes=(e,i)=>EB[i].filter(b=>BE[b].every(k=>k===i||e[k])).length,cntB=(e,b)=>BE[b].filter(k=>e[k]).length;
const freeE=e=>{const a=[];for(let i=0;i<40;i++)if(!e[i])a.push(i);return a},rnd=a=>a[Math.floor(Math.random()*a.length)];
function fval(e,k,memo){if(memo.has(k))return memo.get(k);let best=-99;
 for(let i=0;i<40;i++){if(e[i])continue;const c=closes(e,i);e[i]=1;const v=c?c+fval(e,k+2**i,memo):-fval(e,k+2**i,memo);e[i]=0;if(v>best)best=v}
 if(best===-99)best=0;memo.set(k,best);return best}
function damage(e0,i){const e=e0.slice();e[i]=1;let t=0,j;while((j=freeE(e).find(x=>closes(e,x)))!==undefined){t+=closes(e,j);e[j]=1}return t}
function kkMove(lv,e){const fr=freeE(e);if(lv===0)return rnd(fr);
 const cl=fr.filter(i=>closes(e,i));
 if(lv===2&&fr.length<=17){const memo=new Map();let k=0;for(let i=0;i<40;i++)if(e[i])k+=2**i;let best=-99,bm=[];
  for(const i of fr){const c=closes(e,i);e[i]=1;const v=c?c+fval(e,k+2**i,memo):-fval(e,k+2**i,memo);e[i]=0;if(v>best){best=v;bm=[i]}else if(v===best)bm.push(i)}return rnd(bm)}
 if(cl.length)return rnd(cl);
 const safe=fr.filter(i=>EB[i].every(b=>cntB(e,b)<2));if(safe.length)return rnd(safe);
 if(lv===1)return rnd(fr);
 let md=99,bm=[];for(const i of fr){const d=damage(e,i);if(d<md){md=d;bm=[i]}else if(d===md)bm.push(i)}return rnd(bm)}
/*ENDKK*/
GAMES.push({id:'kk',bot:1,cat:'duel',name:'Käsekästchen',tag:'2 Spieler',color:'#3E9C8F',
 icon:'<rect x="8" y="8" width="32" height="32"/><path d="M24 8v32M8 24h32"/>',
 rules:'Ziehe abwechselnd eine Linie zwischen zwei Punkten. Wer die vierte Seite eines Kästchens schließt, bekommt es und darf direkt noch einmal ziehen. Wer am Ende die meisten Kästchen hat, gewinnt.',
 init(el,api){const bot=api.bot!=null,nm=bot?['Du','🤖 Bot']:['Spieler 1','Spieler 2'],CL=['','#E8684A','#2B8FB3'];
  let e=Array(40).fill(0),own=Array(16).fill(0),cur=1,sc=[0,0],over=0,lastE=-1;
  const chips=[0,1].map(()=>h('div',{class:'chip'})),msg=h('div',{class:'status',style:'font-size:16px'}),bd=h('div',{class:'mboard'});
  el.append(h('div',{class:'chips'},...chips),bd,msg);
  const seg=i=>i<20?[30+(i%4)*60,30+Math.floor(i/4)*60,60,0]:[30+((i-20)%5)*60,30+Math.floor((i-20)/5)*60,0,60];
  function render(){let o='<svg viewBox="0 0 300 300"><rect x="2" y="2" width="296" height="296" rx="22" fill="#F1E9DA"/>';
   own.forEach((w,b)=>{if(w)o+=`<rect x="${33+(b%4)*60}" y="${33+Math.floor(b/4)*60}" width="54" height="54" rx="8" fill="${CL[w]}" fill-opacity=".55"/><text x="${60+(b%4)*60}" y="${68+Math.floor(b/4)*60}" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">${w}</text>`});
   for(let i=0;i<40;i++){const[x,y,dx,dy]=seg(i);o+=`<line x1="${x}" y1="${y}" x2="${x+dx}" y2="${y+dy}" stroke="${e[i]?CL[e[i]]:'#D8CFBC'}" stroke-width="${e[i]?(i===lastE?10:8):5}" stroke-linecap="round"/>`}
   for(let i=0;i<5;i++)for(let j=0;j<5;j++)o+=`<circle cx="${30+j*60}" cy="${30+i*60}" r="6" fill="#4A4339"/>`;
   bd.innerHTML=o+'</svg>';chips.forEach((c,k)=>{c.className='chip'+(k+1===cur&&!over?' on':'');c.textContent=`${nm[k]} · ${sc[k]}`;c.style.setProperty('--c',CL[k+1])})}
  bd.onpointerdown=ev=>{if(over||(bot&&cur===2))return;const r=bd.firstChild.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*300,y=(ev.clientY-r.top)/r.height*300;
   let bi=-1,bdist=26;for(let i=0;i<40;i++){if(e[i])continue;const[sx,sy,dx,dy]=seg(i),l=dx*dx+dy*dy,u=Math.max(0,Math.min(1,((x-sx)*dx+(y-sy)*dy)/l)),d=Math.hypot(sx+dx*u-x,sy+dy*u-y);if(d<bdist){bdist=d;bi=i}}
   if(bi>=0)play(bi)};
  function play(i){if(e[i]||over)return;const c=closes(e,i);e[i]=cur;lastE=i;
   if(c){EB[i].forEach(b=>{if(!own[b]&&BE[b].every(k=>e[k])){own[b]=cur;sc[cur-1]++}})}else cur=3-cur;
   render();
   if(sc[0]+sc[1]===16){over=1;const w=sc[0]===sc[1]?0:sc[0]>sc[1]?1:2;msg.textContent='';
    api.t(()=>api.end({title:w===0?'Unentschieden':bot?(w===1?'Du gewinnst! 🎉':'Der Bot gewinnt 🤖'):nm[w-1]+' gewinnt! 🎉',text:`${nm[0]} ${sc[0]} : ${sc[1]} ${nm[1]}`,btn:'Revanche'}),900);return}
   msg.textContent=c?`${nm[cur-1]} darf nochmal ziehen!`:`${nm[cur-1]} ist dran`;
   if(bot&&cur===2){msg.textContent='🤖 Bot überlegt …';api.t(()=>play(kkMove(api.bot,e)),650+Math.random()*350)}}
  render();msg.textContent=nm[0]+' beginnt'}});
})();
